name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run verify:pack
      - run: node scripts/generate-scenario-docs.mjs --check
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: packages-dist
          path: packages/*/dist
          retention-days: 7

  node20-runtime:
    name: Runtime smoke test (Node 20)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The published packages support Node 20 even though the dev tooling needs 22.
      - run: node scripts/smoke-test.mjs

  time-zones:
    name: Unit tests under TZ=${{ matrix.tz }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [Asia/Kolkata, America/New_York, Pacific/Chatham]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}
          MOCKCLOCK_TEST_TZ: ${{ matrix.tz }}
