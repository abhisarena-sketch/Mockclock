name: Release

# Runs only when a version tag is pushed. Publishing to npm additionally waits
# for a manual approval on the "npm" environment. Nothing publishes on merge.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in core node cli; do
            V=$(node -p "require('./packages/$p/package.json').version")
            if [ "$V" != "$TAG" ]; then echo "packages/$p is $V but tag is $TAG"; exit 1; fi
          done
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run verify:pack
      - name: Pack tarballs
        run: |
          mkdir -p tarballs
          for p in core node cli; do (cd packages/$p && npm pack --pack-destination ../../tarballs); done
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: tarballs/*.tgz
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tarballs/*.tgz --draft --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for details."

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - name: Publish (core, then node, then cli)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in core node cli; do
            (cd packages/$p && npm publish --provenance --access public)
          done
